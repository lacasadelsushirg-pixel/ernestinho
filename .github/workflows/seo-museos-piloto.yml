name: SEO Museos Pilot

on:
  push:
    branches:
      - seo-museos-piloto
    paths:
      - '.github/workflows/seo-museos-piloto.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-museos-piloto
      - name: Patch Museos card navigation directly
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = "onClick={() => setSeccionActual('museos')}"
          new = "onClick={() => { if (window.location.pathname !== '/museos') window.history.pushState({ seccion: 'museos' }, '', '/museos'); setSeccionActual('museos'); }}"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Esperaba 1 botón Museos y encontré {count}; aborto seguro')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit direct navigation fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Patch Museos card navigation directly"
          git push origin seo-museos-piloto
