name: Rebuild Gate
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [rebuild-production-20260924]
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build:css
      - run: test -s assets/css/site.css
      - name: Commit compiled CSS
        run: |
          if ! git diff --quiet -- assets/css/site.css; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add assets/css/site.css
            git commit -m "Rebuild: compile local production CSS"
            git push
          fi
      - name: Persist compiled CSS
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-site-css
          path: assets/css/site.css
          retention-days: 3
      - run: npm run check:syntax

