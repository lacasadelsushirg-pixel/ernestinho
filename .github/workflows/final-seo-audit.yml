name: Final SEO exhaustive audit
on:
  push:
    branches: [final-seo-audit-20260912]
permissions:
  contents: read
  actions: read
  deployments: read
  statuses: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm install
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build exactly as Vercel would
        run: |
          rm -rf dist
          node scripts/apply-deep-entity-selection-fix.js
          node scripts/build-static.js
      - name: Run exhaustive final audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat > /tmp/final-audit.js <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const http=require('http');
          const zlib=require('zlib');
          const {chromium}=require('playwright');
          const DOMAIN='https://www.ernestinhocarioca.com.br';
          const ROOT=process.cwd();
          const OUT=path.join(ROOT,'dist');
          const report={generatedAt:new Date().toISOString(),git:{},inventory:{},sitemap:{},static:{},routing:{},browser:{},googlebot:{},lasai:{},appJs:{},external:{},links:{},robots:{},lastmod:{},vercel:{},risks:[],matrix:{}};
          const exists=p=>fs.existsSync(path.join(ROOT,p));
          const read=p=>exists(p)?fs.readFileSync(path.join(ROOT,p),'utf8'):null;
          const cleanRoute=r=>{let v=r||'/';if(!v.startsWith('/'))v='/'+v;if(v.length>1)v=v.replace(/\/$/,'');return v};
          const fileFor=r=>r==='/'?path.join(OUT,'index.html'):path.join(OUT,r.replace(/^\//,'')+'.html');
          const count=(s,re)=>(s.match(re)||[]).length;
          const one=(s,re)=>{const m=s.match(re);return m?m[1]||'':null};
          const normText=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          async function gh(api){const res=await fetch('https://api.github.com'+api,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28','User-Agent':'ernestinho-final-audit'}}); return {status:res.status,body:await res.json().catch(()=>null)};}
          async function main(){
            const branch=await gh(`/repos/${process.env.REPO}/branches/main`); report.git.mainHead=branch.body?.commit?.sha||null;
            const commits=await gh(`/repos/${process.env.REPO}/commits?sha=main&per_page=25`); report.git.recentCommits=(commits.body||[]).map(x=>({sha:x.sha,message:x.commit?.message,date:x.commit?.committer?.date,author:x.commit?.author?.name}));
            if(report.git.mainHead){const st=await gh(`/repos/${process.env.REPO}/commits/${report.git.mainHead}/status`);report.vercel.mainStatus=st.body;}
            const deps=await gh(`/repos/${process.env.REPO}/deployments?per_page=30`); report.vercel.githubDeployments=(deps.body||[]).map(x=>({id:x.id,ref:x.ref,sha:x.sha,environment:x.environment,created_at:x.created_at,updated_at:x.updated_at,statuses_url:x.statuses_url}));
            const runs=await gh(`/repos/${process.env.REPO}/actions/runs?branch=main&per_page=50`); report.git.mainWorkflowRuns=(runs.body?.workflow_runs||[]).map(x=>({id:x.id,name:x.name,status:x.status,conclusion:x.conclusion,head_sha:x.head_sha,created_at:x.created_at,event:x.event}));

            const files=['index.html','vercel.json','sitemap.xml','robots.txt','package.json','package-lock.json','.vercelignore','api/spa.js','scripts/build-static.js','scripts/audit-static.js','scripts/audit-browser.js','scripts/apply-seo-router-fix.js','scripts/apply-deep-entity-selection-fix.js'];
            report.inventory.files=Object.fromEntries(files.map(f=>[f,{exists:exists(f),bytes:exists(f)?fs.statSync(path.join(ROOT,f)).size:null}]));
            const idx=read('index.html')||'';
            report.inventory.index={hasBrowserBabel:/@babel\/standalone/.test(idx),hasTextBabel:/<script[^>]+type=["']text\/babel["']/.test(idx),hasSeoResolveRoute:/function\s+seoResolveRoute/.test(idx),hasSeoCurrentPath:/function\s+seoCurrentPath/.test(idx),hasMaster4LegacyDataHub:/function\s+Master4LegacyDataHub/.test(idx)};
            const wfDir=path.join(ROOT,'.github','workflows');
            report.inventory.workflows=[];
            if(fs.existsSync(wfDir)) for(const f of fs.readdirSync(wfDir)){const t=fs.readFileSync(path.join(wfDir,f),'utf8');report.inventory.workflows.push({file:f,hasGitPush:/\bgit\s+push\b/.test(t),writesContents:/contents:\s*write/.test(t),pushTrigger:/\bpush\s*:/.test(t),branches:[...t.matchAll(/branches:\s*\[([^\]]+)\]/g)].map(m=>m[1])});}

            const sm=read('sitemap.xml')||'';
            const locs=[...sm.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1].trim());
            const parsed=locs.map(u=>{let x;try{x=new URL(u)}catch(e){};return {raw:u,valid:!!x,host:x?.host||null,protocol:x?.protocol||null,path:x?cleanRoute(x.pathname):null,search:x?.search||'',hash:x?.hash||'',trailing:x?x.pathname.length>1&&x.pathname.endsWith('/'):false}});
            const paths=parsed.filter(x=>x.valid&&x.host==='www.ernestinhocarioca.com.br').map(x=>x.path);
            const dup=[...new Set(paths.filter((p,i,a)=>a.indexOf(p)!==i))];
            const byCat={};for(const p of paths){const c=p==='/'?'/':'/'+p.split('/').filter(Boolean)[0];byCat[c]=(byCat[c]||0)+1;}
            report.sitemap={totalLocs:locs.length,validUrls:parsed.filter(x=>x.valid).length,sameDomain:paths.length,uniquePaths:new Set(paths).size,duplicates:dup,withQuery:parsed.filter(x=>x.search).map(x=>x.raw),withHash:parsed.filter(x=>x.hash).map(x=>x.raw),trailingSlash:parsed.filter(x=>x.trailing).map(x=>x.raw),outsideDomain:parsed.filter(x=>x.valid&&x.host!=='www.ernestinhocarioca.com.br').map(x=>x.raw),invalid:parsed.filter(x=>!x.valid).map(x=>x.raw),byCategory:byCat};
            const lastmods=[...sm.matchAll(/<lastmod>([^<]+)<\/lastmod>/g)].map(m=>m[1].trim());
            const lm={};lastmods.forEach(x=>lm[x]=(lm[x]||0)+1);report.lastmod={count:lastmods.length,distinct:Object.keys(lm).length,distribution:lm,warning:Object.keys(lm).length===1&&lastmods.length===locs.length?'All sitemap URLs share one lastmod; verify this is truthful per URL.':null};
            const robots=read('robots.txt')||'';report.robots={content:robots,allowsAll:/User-agent:\s*\*[\s\S]*Allow:\s*\//i.test(robots),sitemapCorrect:robots.includes(DOMAIN+'/sitemap.xml'),contradictoryDisallow:/Disallow:\s*\//i.test(robots)};

            const staticErrors=[];const staticRows=[];
            for(const r of paths){const f=fileFor(r);if(!fs.existsSync(f)){staticErrors.push({route:r,error:'missing_html'});continue;}const h=fs.readFileSync(f,'utf8');const can=one(h,/<link\s+[^>]*rel=["']canonical["'][^>]*href=["']([^"']+)["'][^>]*>/i)||one(h,/<link\s+[^>]*href=["']([^"']+)["'][^>]*rel=["']canonical["'][^>]*>/i);const rob=one(h,/<meta\s+[^>]*name=["']robots["'][^>]*content=["']([^"']+)["'][^>]*>/i)||one(h,/<meta\s+[^>]*content=["']([^"']+)["'][^>]*name=["']robots["'][^>]*>/i);const title=one(h,/<title>([\s\S]*?)<\/title>/i);const desc=count(h,/<meta\s+[^>]*name=["']description["'][^>]*>/ig);const ogu=count(h,/<meta\s+[^>]*property=["']og:url["'][^>]*>/ig);const issues=[];if(count(h,/<title>/ig)!==1)issues.push('title_count');if(count(h,/<link\s+[^>]*rel=["']canonical["'][^>]*>/ig)!==1)issues.push('canonical_count');if(desc!==1)issues.push('description_count');if(count(h,/<meta\s+[^>]*name=["']robots["'][^>]*>/ig)!==1)issues.push('robots_count');if(ogu!==1)issues.push('og_url_count');if(can!==DOMAIN+(r==='/'?'/':r))issues.push('canonical_mismatch');if(!/index\s*,?\s*follow/i.test(rob||''))issues.push('robots_not_index_follow');if(!title?.trim())issues.push('empty_title');if(issues.length)staticErrors.push({route:r,issues,canonical:can,robots:rob,title});staticRows.push({route:r,bytes:Buffer.byteLength(h),canonical:can,robots:rob,title});}
            report.static={total:paths.length,errors:staticErrors.length,errorSamples:staticErrors.slice(0,100),rows:staticRows};

            const appPath=path.join(OUT,'app.js');const app=fs.readFileSync(appPath);report.appJs={bytes:app.length,mb:+(app.length/1048576).toFixed(2),gzipBytes:zlib.gzipSync(app,{level:9}).length,brotliBytes:zlib.brotliCompressSync(app).length};

            const server=http.createServer((req,res)=>{const u=new URL(req.url,'http://127.0.0.1');let p=decodeURIComponent(u.pathname);let f;if(p==='/app.js')f=appPath;else if(p==='/robots.txt'||p==='/sitemap.xml')f=path.join(OUT,p.slice(1));else f=p==='/'?path.join(OUT,'index.html'):path.join(OUT,p.replace(/^\//,'')+'.html');if(fs.existsSync(f)&&fs.statSync(f).isFile()){res.statusCode=200;res.setHeader('content-type',f.endsWith('.js')?'application/javascript; charset=utf-8':f.endsWith('.xml')?'application/xml; charset=utf-8':'text/html; charset=utf-8');res.end(fs.readFileSync(f));}else{res.statusCode=404;res.setHeader('content-type','text/html; charset=utf-8');res.end(fs.readFileSync(path.join(OUT,'404.html')));}});
            await new Promise(r=>server.listen(4173,'127.0.0.1',r));
            const browser=await chromium.launch({headless:true});
            const all=[];let cursor=0;const workers=Array.from({length:8},async()=>{while(true){const i=cursor++;if(i>=paths.length)break;const route=paths[i];const page=await browser.newPage({viewport:{width:412,height:915}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));await page.route('**/*',async rt=>{const req=rt.request();const url=req.url();if(['image','font','media'].includes(req.resourceType()))return rt.abort();if(url.startsWith('http://127.0.0.1:4173')||/unpkg\.com\/react|unpkg\.com\/react-dom/.test(url))return rt.continue();if(req.resourceType()==='script'&&url.includes('googletagmanager'))return rt.abort();if(req.resourceType()==='script'&&url.includes('xlsx'))return rt.abort();if(req.resourceType()==='script'&&url.includes('lucide'))return rt.abort();if(req.resourceType()==='script'&&url.includes('tailwindcss'))return rt.abort();return rt.continue();});let navError=null;try{await page.goto('http://127.0.0.1:4173'+(route==='/'?'/':route),{waitUntil:'domcontentloaded',timeout:20000});await page.waitForTimeout(250);}catch(e){navError=String(e)}const data=await page.evaluate(()=>({path:location.pathname,title:document.title,canonical:document.querySelector('link[rel="canonical"]')?.href||'',robots:document.querySelector('meta[name="robots"]')?.content||'',text:(document.body?.innerText||'').trim(),h1:[...document.querySelectorAll('h1')].map(x=>x.innerText.trim()).filter(Boolean).slice(0,4),links:[...document.querySelectorAll('a[href]')].map(a=>a.href)})).catch(()=>({path:null,title:null,canonical:null,robots:null,text:'',h1:[],links:[]}));const ok=!navError&&data.path===route&&data.canonical===DOMAIN+(route==='/'?'/':route)&&/index\s*,?\s*follow/i.test(data.robots)&&data.text.length>0&&errors.length===0;all.push({route,ok,navError,pageErrors:errors,path:data.path,title:data.title,canonical:data.canonical,robots:data.robots,textLength:data.text.length,h1:data.h1,links:data.links});await page.close();}});await Promise.all(workers);
            all.sort((a,b)=>a.route.localeCompare(b.route));const fails=all.filter(x=>!x.ok);report.browser={total:all.length,ok:all.length-fails.length,failed:fails.length,failures:fails.slice(0,200)};

            const pathSet=new Set(paths);const incoming=Object.fromEntries(paths.map(p=>[p,0]));const badLinks=[];for(const row of all){for(const href of row.links||[]){let u;try{u=new URL(href)}catch(e){continue}if(u.host!=='127.0.0.1:4173'&&u.host!=='www.ernestinhocarioca.com.br')continue;const p=cleanRoute(u.pathname);if(pathSet.has(p))incoming[p]++;else if(!['/quiero','/ruta-centro','/recorrido-centro'].includes(p)&&p!=='/'&&!p.startsWith('/#'))badLinks.push({from:row.route,to:p});}}
            const orphans=Object.entries(incoming).filter(([p,n])=>p!=='/'&&n===0).map(([p,n])=>p);const weak=Object.entries(incoming).filter(([p,n])=>p!=='/'&&n===1).map(([p,n])=>p);report.links={orphansCount:orphans.length,orphans:orphans.slice(0,300),singleIncomingCount:weak.length,singleIncoming:weak.slice(0,300),badInternalLinksCount:badLinks.length,badInternalLinks:badLinks.slice(0,300),incoming};

            const fake=['/esto-no-existe','/gastronomia/restaurante-inventado','/playas/playa-inventada','/museos/museo-inventado','/barrios/barrio-inventado','/eventos/evento-inventado','/compras/xyz-inventado','/teatros/teatro-inventado','/vida-nocturna/local-inventado'];const fakeRows=[];for(const r of fake){const resp=await fetch('http://127.0.0.1:4173'+r);const t=await resp.text();fakeRows.push({route:r,status:resp.status,noindex:/noindex/i.test(t),nofollow:/nofollow/i.test(t)});}report.routing.fake404=fakeRows;

            const deepPatterns=['gastronomia','playas','teatros','iglesias','centros-culturales','espacios-literarios','vida-nocturna','compras','fuertes-fortalezas','eventos','experiencias','museos','barrios','articulos','guia'];const deepSample=[];for(const cat of deepPatterns){const pick=paths.find(p=>p.startsWith('/'+cat+'/'));if(pick)deepSample.push(pick);}report.routing.deepSample=deepSample;

            const restaurants=paths.filter(p=>p.startsWith('/gastronomia/')).slice(0,5);if(paths.includes('/gastronomia/lasai')&&!restaurants.includes('/gastronomia/lasai'))restaurants.unshift('/gastronomia/lasai');
            const samples=[...new Set(['/','/transportes','/copacabana','/gastronomia/lasai',...deepSample,...restaurants])].filter(x=>paths.includes(x)||x==='/');
            async function inspect(base,route,ua){const page=await browser.newPage({viewport:{width:412,height:915},userAgent:ua});const reqs=[];const failed=[];const consoleErrors=[];page.on('request',r=>reqs.push({url:r.url(),type:r.resourceType()}));page.on('requestfailed',r=>failed.push({url:r.url(),error:r.failure()?.errorText||''}));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});const t0=Date.now();let status=null,navError=null;try{const resp=await page.goto(base+(route==='/'?'/':route),{waitUntil:'domcontentloaded',timeout:30000});status=resp?.status()||null;}catch(e){navError=String(e)}const domMs=Date.now()-t0;await page.waitForTimeout(700);const d=await page.evaluate(()=>({path:location.pathname,title:document.title,canonical:document.querySelector('link[rel="canonical"]')?.href||'',robots:document.querySelector('meta[name="robots"]')?.content||'',textLength:(document.body?.innerText||'').length,htmlLength:document.documentElement.outerHTML.length,images:document.images.length,completeImages:[...document.images].filter(x=>x.complete&&x.naturalWidth>0).length,h1:[...document.querySelectorAll('h1')].map(x=>x.innerText.trim()).filter(Boolean).slice(0,5)})).catch(()=>({}));await page.close();return {route,status,navError,domMs,requests:reqs.length,imageRequests:reqs.filter(x=>x.type==='image').length,failed:failed.slice(0,40),consoleErrors:consoleErrors.slice(0,40),...d};}
            const UA='Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)';
            report.googlebot.local=[];for(const r of samples)report.googlebot.local.push(await inspect('http://127.0.0.1:4173',r,UA));
            report.lasai.local=report.googlebot.local.find(x=>x.route==='/gastronomia/lasai')||null;

            report.external.production=[];for(const r of [...new Set(['/','/transportes','/copacabana','/gastronomia/lasai',...deepSample.slice(0,8),...restaurants])]){for(const mode of ['normal','googlebot']){const ua=mode==='googlebot'?UA:'Mozilla/5.0 Chrome/140 Safari/537.36';try{const row=await inspect(DOMAIN,r,ua);row.mode=mode;report.external.production.push(row);}catch(e){report.external.production.push({route:r,mode,error:String(e)})}}}
            try{const p=await fetch(DOMAIN+'/app.js',{headers:{'Accept-Encoding':'br,gzip','User-Agent':UA}});report.appJs.production={status:p.status,contentEncoding:p.headers.get('content-encoding'),contentLength:p.headers.get('content-length'),cacheControl:p.headers.get('cache-control'),etag:p.headers.get('etag')};}catch(e){report.appJs.production={error:String(e)}}

            await browser.close();server.close();
            const vercelStatuses=(report.vercel.mainStatus?.statuses||[]).filter(x=>String(x.context||'').toLowerCase().includes('vercel'));report.vercel.contexts=vercelStatuses.map(x=>({context:x.context,state:x.state,target_url:x.target_url,description:x.description}));report.vercel.connectedProjects=[...new Set(vercelStatuses.map(x=>(x.context||'').replace(/^Vercel\s*[–-]\s*/i,'')))];report.vercel.buildRateLimit=vercelStatuses.some(x=>String(x.target_url||'').includes('build-rate-limit'));
            const prodLasai=report.external.production.filter(x=>x.route==='/gastronomia/lasai');report.lasai.production=prodLasai;
            const staticPass=report.static.errors===0;const browserPass=report.browser.failed===0;const fakePass=report.routing.fake404.every(x=>x.status===404&&x.noindex);const robotsPass=report.robots.allowsAll&&report.robots.sitemapCorrect&&!report.robots.contradictoryDisallow;const googleLocalPass=report.googlebot.local.every(x=>x.status===200&&x.path===x.route&&x.canonical===DOMAIN+(x.route==='/'?'/':x.route)&&/index\s*,?\s*follow/i.test(x.robots||'')&&!x.navError);const lasaiPass=report.lasai.local&&report.lasai.local.status===200&&report.lasai.local.path==='/gastronomia/lasai'&&report.lasai.local.canonical===DOMAIN+'/gastronomia/lasai'&&report.lasai.local.images<50;
            report.matrix={sitemap:{status:report.sitemap.totalLocs===report.sitemap.uniquePaths&&!report.sitemap.duplicates.length?'PASS':'FAIL',detail:`${report.sitemap.uniquePaths}/${report.sitemap.totalLocs} unique`},static:{status:staticPass?'PASS':'FAIL',detail:`${report.static.errors} errors`},chromium:{status:browserPass?'PASS':'FAIL',detail:`${report.browser.ok}/${report.browser.total}`},googlebotLocal:{status:googleLocalPass?'PASS':'FAIL',detail:`${report.googlebot.local.length} representative routes`},lasai:{status:lasaiPass?'PASS':'WARNING',detail:report.lasai.local?`${report.lasai.local.images} DOM images, ${report.lasai.local.imageRequests} requested`:'missing'},fake404:{status:fakePass?'PASS':'FAIL',detail:`${report.routing.fake404.filter(x=>x.status===404).length}/${report.routing.fake404.length}`},robots:{status:robotsPass?'PASS':'FAIL'},internalLinks:{status:report.links.badInternalLinksCount===0?'PASS':'WARNING',detail:`orphans=${report.links.orphansCount}, badLinks=${report.links.badInternalLinksCount}`},lastmod:{status:report.lastmod.warning?'WARNING':'PASS',detail:report.lastmod.warning},vercel:{status:report.vercel.buildRateLimit?'WARNING':'PASS',detail:report.vercel.buildRateLimit?'main HEAD blocked by build-rate-limit':'no build-rate-limit detected'}};
            if(report.lastmod.warning)report.risks.push(report.lastmod.warning);if(report.links.orphansCount)report.risks.push(`${report.links.orphansCount} sitemap routes have zero rendered <a> incoming links in the local crawl; JS-button navigation may explain part of this.`);if(report.vercel.connectedProjects.length>1)report.risks.push(`${report.vercel.connectedProjects.length} Vercel status contexts are connected to main: ${report.vercel.connectedProjects.join(', ')}. Each commit may fan out into multiple builds.`);if(report.vercel.buildRateLimit)report.risks.push('Current main HEAD has Vercel build-rate-limit status; production may still be serving an earlier commit.');
            fs.writeFileSync('final-seo-audit-report.json',JSON.stringify(report,null,2));
            const md=[];md.push('# Ernestinho Carioca — Final SEO Audit');md.push(`Generated: ${report.generatedAt}`);md.push('');md.push('## Matrix');for(const [k,v] of Object.entries(report.matrix))md.push(`- **${k}**: ${v.status}${v.detail?' — '+v.detail:''}`);md.push('');md.push('## Key facts');md.push(`- main HEAD: ${report.git.mainHead}`);md.push(`- sitemap: ${report.sitemap.totalLocs} locs, ${report.sitemap.uniquePaths} unique`);md.push(`- static errors: ${report.static.errors}`);md.push(`- Chromium: ${report.browser.ok}/${report.browser.total}`);md.push(`- Lasai local: ${JSON.stringify(report.lasai.local)}`);md.push(`- Vercel projects/status contexts: ${report.vercel.connectedProjects.join(', ')}`);md.push(`- Build rate limit: ${report.vercel.buildRateLimit}`);md.push(`- Orphans: ${report.links.orphansCount}`);md.push(`- Bad internal links: ${report.links.badInternalLinksCount}`);md.push('');md.push('## Risks');for(const r of report.risks)md.push(`- ${r}`);fs.writeFileSync('final-seo-audit-report.md',md.join('\n'));
            console.log(JSON.stringify({matrix:report.matrix,lasai:report.lasai.local,vercel:report.vercel.contexts,risks:report.risks},null,2));
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/final-audit.js
      - name: Upload final audit report
        uses: actions/upload-artifact@v4
        with:
          name: final-seo-audit-report
          path: |
            final-seo-audit-report.json
            final-seo-audit-report.md
          if-no-files-found: error
