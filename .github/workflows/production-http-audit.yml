name: Production HTTP audit
on:
  push:
    branches:
      - seo-audit-20260912
permissions:
  contents: write
jobs:
  audit-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check production with browser and Googlebot
        shell: bash
        run: |
          set -u
          BASE="https://www.ernestinhocarioca.com.br"
          OUT="production-http-audit.txt"
          : > "$OUT"
          BROWSER="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36"
          GOOGLEBOT="Mozilla/5.0 (Linux; Android 6.0.1; Nexus 5X Build/MMB29P) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0.0.0 Mobile Safari/537.36 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)"
          for UA_LABEL in BROWSER GOOGLEBOT; do
            if [ "$UA_LABEL" = "BROWSER" ]; then UA="$BROWSER"; else UA="$GOOGLEBOT"; fi
            for P in / /transportes /copacabana /gastronomia/lasai /experiencias/rapel /esto-no-existe-ernestinho-12345 /app.js; do
              echo "===== $UA_LABEL $P =====" >> "$OUT"
              curl -sS -L --max-time 30 -A "$UA" -D /tmp/headers -o /tmp/body "$BASE$P" || true
              STATUS=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}' /tmp/headers 2>/dev/null)
              echo "status=${STATUS:-curl_error}" >> "$OUT"
              grep -iE '^(content-type|content-length|content-encoding|cache-control|x-vercel-|location):' /tmp/headers | tail -20 >> "$OUT" || true
              echo "bytes=$(wc -c < /tmp/body 2>/dev/null || echo 0)" >> "$OUT"
              grep -ioE '<title[^>]*>[^<]*</title>' /tmp/body | head -1 >> "$OUT" || true
              grep -ioE '<link[^>]+rel=["'"'']canonical["'"''][^>]*>' /tmp/body | head -1 >> "$OUT" || true
              grep -ioE '<meta[^>]+name=["'"'']robots["'"''][^>]*>' /tmp/body | head -1 >> "$OUT" || true
              if grep -q '/app.js' /tmp/body; then echo 'appjs=yes' >> "$OUT"; else echo 'appjs=no' >> "$OUT"; fi
              echo >> "$OUT"
            done
          done
          cat "$OUT"
      - name: Commit production report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production-http-audit.txt
          git diff --cached --quiet || git commit -m "chore: refresh production HTTP audit"
          git push
