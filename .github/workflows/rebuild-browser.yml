name: Rebuild Browser Gate
on:
  workflow_dispatch:
  push:
    branches: [rebuild-production-20260924]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start rebuild candidate locally
        run: |
          node scripts/serve-rebuild.js > /tmp/rebuild-server.log 2>&1 &
          echo $! > /tmp/rebuild-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rebuild-server.log
          exit 1
      - name: Test rebuild candidate
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:4173
      - name: Show local server log on failure
        if: failure()
        run: cat /tmp/rebuild-server.log || true
