name: SEO Museos Pilot

on:
  push:
    branches:
      - seo-museos-piloto
    paths:
      - '.github/workflows/seo-museos-piloto.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-museos-piloto
      - name: Fix Museos URL synchronization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker="  const [categoriaCompras, setCategoriaCompras] = useState('shoppings');"
          effect="""  useEffect(() => {
    if (seccionActual === 'museos' && window.location.pathname !== '/museos') {
      window.history.pushState({ seccion: 'museos' }, '', '/museos');
    }
  }, [seccionActual]);

"""
          if "}, [seccionActual]);" not in text:
              if marker not in text:
                  raise SystemExit('No encontré el punto seguro para aplicar el arreglo')
              text=text.replace(marker,effect+marker,1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit pilot fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Museos URL synchronization"
          git push origin seo-museos-piloto
