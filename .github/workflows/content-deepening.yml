name: Apply content deepening
on:
  push:
    branches: [contenido-profundo-copacabana-carnaval-live]
    paths:
      - 'scripts/apply_content_deepening.py'
      - 'scripts/final_preview_fixes.py'
      - 'api/**'
      - '.github/workflows/content-deepening.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_content_deepening.py
      - name: Inspect month routing before final fix
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for term in ['rio_mes_a_mes','grandes_eventos','Master3MonthWeatherPlanner']:
              print('\n###',term)
              start=0
              for _ in range(12):
                  i=s.find(term,start)
                  if i<0: break
                  print(s[max(0,i-140):i+220].replace('\n',' '))
                  start=i+len(term)
          PY
      - run: python scripts/final_preview_fixes.py
      - name: Validate anchors and routes
        run: |
          grep -q 'ESTOY EN COPACABANA Y NECESITO' index.html
          grep -q 'SOCIO OFICIAL · 5% DE DESCUENTO' index.html
          grep -q 'function Master3MonthWeatherPlanner' index.html
          grep -q '/api/inea-balneabilidade' index.html
          grep -q '/api/marinha-ressaca' index.html
          grep -q 'CHM · lectura automática' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('const COPA_UTIL_SERVICES = [') == 1, 'COPA_UTIL_SERVICES duplicate/missing'
          assert s.count('function CopacabanaUtil') == 1, 'CopacabanaUtil duplicate/missing'
          assert s.count("{ id: 'rio_mes_a_mes', label: 'Mes a mes', icon: 'calendar-days' },") == 1, 'Mes a mes main-nav item duplicate/missing'
          assert s.count("case 'rio_mes_a_mes': return <Master3MonthWeatherPlanner />;") == 1, 'Mes a mes route duplicate/missing'
          assert "case 'rio_mes_a_mes': return <Rio365" not in s, 'Broken Rio365 route remains'
          assert '/api/inea-balneabilidade' in s, 'INEA endpoint missing'
          assert '/api/marinha-ressaca' in s, 'CHM endpoint missing'
          assert 'Vivir un partido de fútbol en Río' in s, 'Football deepening missing'
          assert 'partnerUrl' in s and 'COMPRAR CON 5% DE DESCUENTO' in s, 'Carnaval partner CTA data missing'
          print('structural validation passed')
          PY
      - name: Commit generated index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Apply final validated content preview'
          git push
