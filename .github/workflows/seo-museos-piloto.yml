name: SEO Ernestinho Finalizer

on:
  push:
    branches:
      - seo-museos-piloto
    paths:
      - '.github/workflows/seo-museos-piloto.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-museos-piloto
      - name: Complete detail routing and rebuild sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, unicodedata, html, json
          p=Path('index.html'); text=p.read_text(encoding='utf-8')

          # Helpers used by selector-style sections (teatros, iglesias, etc.).
          marker='function seoNavigate(path,mode=\'push\')'
          if 'function seoInitialItemId(' not in text:
              pos=text.find(marker)
              if pos<0: raise SystemExit('SEO router helper not found')
              helper="""function seoInitialItemId(prefix,data,defaultId){const r=seoCleanPath(location.pathname),m=r.match(new RegExp('^/'+prefix+'/([^/]+)$'));if(!m)return defaultId;const x=data.find(v=>seoSlug(v.nombre)===m[1]||seoSlug(v.id)===m[1]);return x?x.id:defaultId;}\nfunction seoLocalMeta(prefix,item){if(!item)return;seoSetMeta({path:`/${prefix}/${seoSlug(item.nombre)}`,title:`${item.nombre} en Río de Janeiro | Ernestinho Carioca`,description:item.descripcion||item.resumen||item.subtitulo||item.categoria||`Guía de ${item.nombre} en Río de Janeiro.`});}\n"""
              text=text[:pos]+helper+text[pos:]

          # Global resolver must keep the correct parent section for direct detail URLs.
          needle="if(SEO_PREFERRED[r])return{...base,seccion:SEO_PREFERRED[r]};"
          if "const localParents=" not in text:
              insert="const localParents=[['centros-culturales','centros_culturales'],['espacios-literarios','espacios_literarios'],['teatros','teatros'],['iglesias','iglesias'],['fuertes-fortalezas','fuertes_fortalezas'],['eventos','grandes_eventos']];const lp=localParents.find(([pre])=>r.startsWith('/'+pre+'/'));if(lp)return{...base,seccion:lp[1]};"
              if needle not in text: raise SystemExit('Resolver anchor not found')
              text=text.replace(needle,insert+needle,1)

          def patch_component(name, state_var, setter, data_name, default_id, prefix, current_var, selector_setter, search_setter, search_reset=True):
              nonlocal_text=None

          specs=[
            ('SeccionEspaciosLiterarios','espacioSeleccionado','setEspacioSeleccionado','ESPACIOS_LITERARIOS_DATA','real-gabinete','espacios-literarios','espacioActual','setSelectorLiterarioAbierto','setBusquedaLiteraria'),
            ('SeccionCentrosCulturales','centroSeleccionado','setCentroSeleccionado','CENTROS_CULTURALES_DATA','espaco-marinha','centros-culturales','centroActual','setSelectorCentrosAbierto','setBusquedaCentro'),
            ('SeccionTeatros','teatroSeleccionado','setTeatroSeleccionado','TEATROS_DATA','theatro-municipal','teatros','teatroActual','setSelectorTeatrosAbierto','setBusquedaTeatro'),
            ('SeccionIglesias','iglesiaSeleccionada','setIglesiaSeleccionada','IGLESIAS_DATA','catedral-metropolitana','iglesias','iglesiaActual','setSelectorIglesiasAbierto','setBusquedaIglesia'),
            ('SeccionFuertesFortalezas','fuerteSeleccionado','setFuerteSeleccionado','FUERTES_DATA','forte-copacabana','fuertes-fortalezas','fuerteActual','setSelectorFuertesAbierto','setBusquedaFuerte'),
          ]
          for fname,state,setter,data,default,prefix,current,selector,search in specs:
              # Initial selection from direct URL.
              old=f"useState('{default}');"
              new=f"useState(()=>seoInitialItemId('{prefix}',{data},'{default}'));"
              start=text.find(f'function {fname}()')
              if start<0: raise SystemExit(f'{fname} missing')
              end=text.find('\nfunction ',start+10)
              if end<0: end=len(text)
              chunk=text[start:end]
              if new not in chunk:
                  if old not in chunk: raise SystemExit(f'{fname} state anchor missing')
                  chunk=chunk.replace(old,new,1)
              # Selector clicks become clean client-side URLs.
              oldclick=f"{setter}({state[:-12] if False else ''})"
              # Use exact data-loop variable from component naming convention.
              var={'SeccionEspaciosLiterarios':'espacio','SeccionCentrosCulturales':'centro','SeccionTeatros':'teatro','SeccionIglesias':'iglesia','SeccionFuertesFortalezas':'fuerte'}[fname]
              target=f"{setter}({var}.id);"
              if f"seoNavigate(`/{prefix}/${{seoSlug({var}.nombre)}}`);" not in chunk:
                  if target not in chunk: raise SystemExit(f'{fname} selector target missing')
                  chunk=chunk.replace(target,f"seoNavigate(`/{prefix}/${{seoSlug({var}.nombre)}}`);\n                        {target}",1)
              # Local popstate + per-item metadata.
              hook_key=f"seoLocalMeta('{prefix}',{current})"
              if hook_key not in chunk:
                  anchor=f"const {current} = {data}.find("
                  ai=chunk.find(anchor)
                  if ai<0: raise SystemExit(f'{fname} current item anchor missing')
                  # Find the semicolon ending the find expression.
                  semi=chunk.find(';',ai)
                  if semi<0: raise SystemExit(f'{fname} current item end missing')
                  semi+=1
                  hook=f"\n\n  useEffect(()=>{{const sync=()=>{{const id=seoInitialItemId('{prefix}',{data},'{default}');{setter}(id);}};addEventListener('popstate',sync);return()=>removeEventListener('popstate',sync);}},[]);\n  useEffect(()=>{{seoLocalMeta('{prefix}',{current});}},[{state}]);"
                  chunk=chunk[:semi]+hook+chunk[semi:]
              text=text[:start]+chunk+text[end:]

          # Event detail routing, metadata and browser navigation.
          es=text.find('function GrandesEventosPage({onBack})')
          ee=text.find('\nfunction AppErnestinho()',es)
          if es<0 or ee<0: raise SystemExit('GrandesEventosPage boundaries missing')
          ev=text[es:ee]
          old="const [seleccionado,setSeleccionado]=useState(null);"
          new="const [seleccionado,setSeleccionado]=useState(()=>{const m=seoCleanPath(location.pathname).match(/^\\/eventos\\/([^/]+)$/);return m?GRANDES_EVENTOS.find(e=>seoSlug(e.nombre)===m[1]||seoSlug(e.id)===m[1])||null:null;});"
          if new not in ev:
              if old not in ev: raise SystemExit('Event initial state missing')
              ev=ev.replace(old,new,1)
          if "seoLocalMeta('eventos',seleccionado)" not in ev:
              anchor="useEffect(()=>{ window.scrollTo({top:0,left:0,behavior:'auto'}); },[seleccionado]);"
              hooks="""useEffect(()=>{ window.scrollTo({top:0,left:0,behavior:'auto'}); },[seleccionado]);
  useEffect(()=>{const sync=()=>{const m=seoCleanPath(location.pathname).match(/^\/eventos\/([^/]+)$/);setSeleccionado(m?GRANDES_EVENTOS.find(e=>seoSlug(e.nombre)===m[1]||seoSlug(e.id)===m[1])||null:null);};addEventListener('popstate',sync);return()=>removeEventListener('popstate',sync);},[]);
  useEffect(()=>{if(seleccionado)seoLocalMeta('eventos',seleccionado);else seoSetMeta({path:'/eventos',title:'Eventos en Río de Janeiro | Ernestinho Carioca',description:'Carnaval, Réveillon, Rock in Rio y otros grandes eventos de Río de Janeiro.'});},[seleccionado]);"""
              if anchor not in ev: raise SystemExit('Event effect anchor missing')
              ev=ev.replace(anchor,hooks,1)
          ev=ev.replace("onClick={()=>setSeleccionado(e)}","onClick={()=>{seoNavigate(`/eventos/${seoSlug(e.nombre)}`);setSeleccionado(e)}}")
          ev=ev.replace("onClick={()=>setSeleccionado(null)}","onClick={()=>{seoNavigate('/eventos');setSeleccionado(null)}}")
          text=text[:es]+ev+text[ee:]

          p.write_text(text,encoding='utf-8')

          def slug(v):
              v=unicodedata.normalize('NFD',str(v or ''));v=''.join(c for c in v if unicodedata.category(c)!='Mn').lower().replace('&',' y ');return re.sub(r'^-+|-+$','',re.sub(r'[^a-z0-9]+','-',v))
          def block(a,b):
              i=text.find(a); j=text.find(b,i+len(a)) if i>=0 else -1
              return text[i:j] if i>=0 and j>=0 else ''
          def field_vals(s,f): return re.findall(r"\b"+re.escape(f)+r"\s*:\s*['\"]([^'\"\n]+)['\"]",s)
          def g_names(s): return re.findall(r"\bg\(\s*['\"][^'\"]+['\"]\s*,\s*['\"]([^'\"]+)['\"]",s)

          urls={'/','/que-hacer','/atracciones','/museos','/centros-culturales','/iglesias','/fuertes-fortalezas','/teatros','/espacios-literarios','/playas','/naturaleza','/aventura','/fotografia','/familia','/gastronomia','/vida-nocturna','/compras','/barrios','/hospedaje','/transportes','/transportes/transporte-publico','/transportes/metro','/transportes/uber','/transportes/bicicletas','/transportes/traslados','/guia','/guia/pix','/consejos','/eventos','/experiencias','/copacabana','/cafe-ernestinho','/descubre-rio','/rio-en-vivo','/tv','/patrimonio','/ocio','/prepara-tu-viaje','/para-mi','/sos','/lugares'}
          # Real datasets only — carefully bounded to prevent accidental titles from other collections.
          for n in field_vals(block('const MUSEOS_DATA = [','const ESPACIOS_LITERARIOS_DATA = ['),'nombre'): urls.add('/museos/'+slug(n))
          for n in field_vals(block('const ESPACIOS_LITERARIOS_DATA = [','const CENTROS_CULTURALES_DATA = ['),'nombre'): urls.add('/espacios-literarios/'+slug(n))
          for n in field_vals(block('const CENTROS_CULTURALES_DATA = [','const TEATROS_DATA = ['),'nombre'): urls.add('/centros-culturales/'+slug(n))
          for n in field_vals(block('const TEATROS_DATA = [','const IGLESIAS_DATA = ['),'nombre'): urls.add('/teatros/'+slug(n))
          for n in field_vals(block('const IGLESIAS_DATA = [','const FUERTES_DATA = ['),'nombre'): urls.add('/iglesias/'+slug(n))
          for n in field_vals(block('const FUERTES_DATA = [','function SeccionEspaciosLiterarios'),'nombre'): urls.add('/fuertes-fortalezas/'+slug(n))
          for n in field_vals(block('const BARRIOS_DATA = [','const MASTER3_NEIGHBORHOOD_BLUEPRINT'),'nombre'):
              if not slug(n).startswith('copacabana'): urls.add('/barrios/'+slug(n))
          exp_names=field_vals(block('const EXPERIENCIAS_DATA = [','const ACTIVIDADES_NUEVAS = ['),'titulo')
          exp_names+=field_vals(block('const ACTIVIDADES_NUEVAS = [','const TRANSCARIOCA_TRECHOS = ['),'titulo')
          for n in exp_names: urls.add('/experiencias/'+slug(n))
          for n in field_vals(block('const ARTICULOS_CONSEJOS = [','const CAFE_PRODUCTOS'),'titulo'): urls.add('/articulos/'+slug(n))
          gastr=field_vals(block('const GASTRONOMIA_BASE = [','const g = '),'nombre')+g_names(block('const GASTRONOMIA_EXTRA = [','const FOTOS_GASTRONOMIA = ['))
          for n in gastr: urls.add('/gastronomia/'+slug(n))
          for n in field_vals(block('const GRANDES_EVENTOS = [','const OTROS_EVENTOS_RIO = ['),'nombre'): urls.add('/eventos/'+slug(n))
          for n in field_vals(block('const GUIA_INFO=','function GuiaRioCompleta'),'titulo'): urls.add('/guia/'+slug(n))
          places=['cristo-redentor','pao-de-acucar','museu-do-amanha','aquario','buzios','palacio-do-catete','forte-de-copacabana','real-gabinete-portugues','ipanema','jardim-botanico','parque-lage','lapa','mam-rio','mar','maracana','musal','pedra-bonita','santa-teresa','escadaria-selaron','floresta-da-tijuca']; urls.update('/lugares/'+x for x in places)

          base='https://www.ernestinhocarioca.com.br'; rows=[]
          for u in sorted(urls,key=lambda x:(x.count('/'),x)):
              pr='1.0' if u=='/' else ('0.9' if u.count('/')==1 else '0.8')
              rows.append(f'  <url>\n    <loc>{html.escape(base+u)}</loc>\n    <lastmod>2026-09-05</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>{pr}</priority>\n  </url>')
          Path('sitemap.xml').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+'\n'.join(rows)+'\n</urlset>\n',encoding='utf-8')
          Path('robots.txt').write_text('User-agent: *\nAllow: /\n\nSitemap: https://www.ernestinhocarioca.com.br/sitemap.xml\n',encoding='utf-8')
          prefixes=sorted({u.split('/')[1] for u in urls if u!='/'})
          Path('vercel.json').write_text(json.dumps({'rewrites':[{'source':'/'+x,'destination':'/index.html'} for x in prefixes]+[{'source':'/'+x+'/:path*','destination':'/index.html'} for x in prefixes]},indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('TOTAL',len(urls),'MUSEOS',sum(u.startswith('/museos/') for u in urls),'EXPERIENCIAS',sum(u.startswith('/experiencias/') for u in urls),'EVENTOS',sum(u.startswith('/eventos/') for u in urls),'GASTRONOMIA',sum(u.startswith('/gastronomia/') for u in urls))
          PY
      - name: Validate SEO output
        run: |
          python -m json.tool vercel.json >/dev/null
          grep -q '/museos/museu-do-amanha' sitemap.xml
          grep -q '/eventos/carnaval-de-rio' sitemap.xml
          grep -q '/experiencias/full-day-rio' sitemap.xml
          ! grep -q '/experiencias/aceptar-ayuda-de-desconocidos' sitemap.xml
          grep -q "seoLocalMeta('teatros'" index.html
          grep -q "seoLocalMeta('eventos'" index.html
          echo "URLs: $(grep -c '<url>' sitemap.xml)"
      - name: Commit final SEO pilot
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml robots.txt vercel.json
          git commit -m "Complete SEO detail routes and clean sitemap"
          git push origin seo-museos-piloto
