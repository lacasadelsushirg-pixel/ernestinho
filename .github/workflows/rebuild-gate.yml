name: Rebuild Gate
on:
  workflow_dispatch:
  push:
    branches: [rebuild-production-20260924]
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check:syntax

