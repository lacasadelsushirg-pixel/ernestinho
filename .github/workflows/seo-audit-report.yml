name: SEO audit report
on:
  push:
    branches: [seo-audit-20260912]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install build dependency
        run: npm install
      - name: Build static site
        run: node scripts/build-static.js
      - name: Generate static audit report
        run: node scripts/audit-static.js || true
      - name: Install Playwright for hydration audit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit every sitemap route in Chromium
        run: node scripts/audit-browser.js || true
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-audit-report.json seo-browser-audit.json
          git diff --cached --quiet || git commit -m "chore: update SEO audit reports"
          git push
      - name: Enforce zero static build errors
        run: node -e "const r=require('./seo-audit-report.json'); if(r.errors.length){ console.error(r.errors.slice(0,100)); process.exit(1) }"
