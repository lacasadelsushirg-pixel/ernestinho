name: Final source diagnostics
on:
  push:
    branches: [final-seo-audit-20260912]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          npm install
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Extract source diagnostics and reproduce critical routes unminified
        run: |
          cat > source-diagnostics.js <<'NODE'
          const fs=require('fs'),http=require('http'),esbuild=require('esbuild');
          const {chromium}=require('playwright');
          const src=fs.readFileSync('index.html','utf8');
          const out={generatedAt:new Date().toISOString(),snippets:{},occurrences:{},runtime:{}};
          function excerpts(label,patterns,radius=7000,max=30){const arr=[];for(const pat of patterns){let start=0;while(arr.length<max){const i=src.indexOf(pat,start);if(i<0)break;arr.push({pattern:pat,index:i,text:src.slice(Math.max(0,i-radius),Math.min(src.length,i+pat.length+radius))});start=i+pat.length;}}out.snippets[label]=arr;}
          excerpts('gastronomy_state',['restauranteSeleccionado','setRestauranteSeleccionado','rutaSeoInicial.restaurante','abrirDetalleRuta','seccionActual === \'gastronomia\'','seccionActual === "gastronomia"'],12000,40);
          excerpts('gastronomy_ui',['DÓNDE COMER EN RÍO DE JANEIRO','183 lugares seleccionados','lugares seleccionados','GASTRONOMIA_DATA.map','GASTRONOMIA_DATA.filter','restauranteSeleccionado &&','!restauranteSeleccionado'],14000,30);
          excerpts('restaurants',["g('mee'","id:'mee'","g('lasai'","id:'lasai'","bar-momo","Bar do Momo"],7000,30);
          excerpts('whatsapp',['TU_LINK_WHATSAPP'],5000,20);
          excerpts('experiences',['buzios-tour-en-goleta','full-day-rio','Búzios en Goleta','Full Day Río','fetch(','new Image(','Image()'],9000,40);
          excerpts('routing',['function seoResolveRoute','function seoCurrentPath','/gastronomia/([^/]+)'],10000,20);
          excerpts('app_init',['function AppErnestinho','const rutaSeoInicial','seoResolveRoute(window.location.pathname)'],12000,20);
          out.occurrences={restauranteSeleccionado:(src.match(/restauranteSeleccionado/g)||[]).length,setRestauranteSeleccionado:(src.match(/setRestauranteSeleccionado/g)||[]).length,TU_LINK_WHATSAPP:(src.match(/TU_LINK_WHATSAPP/g)||[]).length,mee:(src.match(/\bmee\b/gi)||[]).length,momo:(src.match(/\bmomo\b/gi)||[]).length};
          const m=src.match(/<script\s+type=["']text\/babel["'][^>]*>([\s\S]*?)<\/script>/i);if(!m)throw new Error('inline JSX missing');
          require('./scripts/apply-seo-router-fix.js');require('./scripts/apply-deep-entity-selection-fix.js');
          const patched=fs.readFileSync('index.html','utf8'),mm=patched.match(/<script\s+type=["']text\/babel["'][^>]*>([\s\S]*?)<\/script>/i);
          const transformed=esbuild.transformSync(mm[1],{loader:'jsx',target:'es2018',minify:false,sourcemap:'inline',sourcefile:'index-inline.jsx',jsxFactory:'React.createElement',jsxFragment:'React.Fragment'}).code;
          let shell=patched.replace(mm[0],'<script src="/app.js"></script>').replace(/<script[^>]+@babel\/standalone[^>]*><\/script>/i,'');
          const server=http.createServer((req,res)=>{const u=new URL(req.url,'http://x');if(u.pathname==='/app.js'){res.setHeader('content-type','application/javascript');return res.end(transformed)}res.setHeader('content-type','text/html');res.end(shell)});
          async function run(){await new Promise(r=>server.listen(4191,'127.0.0.1',r));const browser=await chromium.launch({headless:true});for(const route of ['/gastronomia/mee','/gastronomia/bar-do-momo','/gastronomia/lasai','/gastronomia/abencoado','/experiencias/buzios-tour-en-goleta','/experiencias/full-day-rio']){const p=await browser.newPage();const errors=[],failed=[],consoleErrors=[];p.on('pageerror',e=>errors.push({message:e.message,stack:e.stack}));p.on('requestfailed',r=>failed.push({url:r.url(),type:r.resourceType(),error:r.failure()?.errorText||''}));p.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});let nav=null,status=null;try{const rr=await p.goto('http://127.0.0.1:4191'+route,{waitUntil:'domcontentloaded',timeout:20000});status=rr?.status()||null;await p.waitForTimeout(900)}catch(e){nav=String(e)}const d=await p.evaluate(()=>({path:location.pathname,title:document.title,text:(document.body?.innerText||'').slice(0,1600),textLength:(document.body?.innerText||'').length,h1:[...document.querySelectorAll('h1')].map(x=>x.innerText),images:document.images.length,canonical:document.querySelector('link[rel=canonical]')?.href||'',robots:document.querySelector('meta[name=robots]')?.content||''})).catch(()=>({}));out.runtime[route]={status,nav,errors,failed:failed.slice(0,50),consoleErrors:consoleErrors.slice(0,50),...d};await p.close();}await browser.close();server.close();fs.writeFileSync('final-source-diagnostics.json',JSON.stringify(out,null,2));fs.writeFileSync('final-source-diagnostics.txt',Object.entries(out.snippets).map(([k,v])=>'===== '+k+' =====\n'+v.map(x=>`\n--- ${x.pattern} @ ${x.index} ---\n${x.text}`).join('\n')).join('\n\n')+'\n\n===== RUNTIME =====\n'+JSON.stringify(out.runtime,null,2));console.log(JSON.stringify({occurrences:out.occurrences,runtime:out.runtime},null,2));}
          run().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node source-diagnostics.js
      - uses: actions/upload-artifact@v4
        with:
          name: final-source-diagnostics
          path: |
            final-source-diagnostics.json
            final-source-diagnostics.txt
