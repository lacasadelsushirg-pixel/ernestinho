function SeccionCentrosCulturales() {

  const [centroSeleccionado, setCentroSeleccionado] =
    useState('espaco-marinha');

    useState(false);

  const [busquedaCentro, setBusquedaCentro] =
    useState('');

  const centroActual = CENTROS_CULTURALES_DATA.find(
    (centro) => centro.id === centroSeleccionado
  );

  const centrosFiltrados = CENTROS_CULTURALES_DATA.filter(
    (centro) =>
      centro.nombre
        .toLowerCase()
        .includes(busquedaCentro.toLowerCase())

  return (
    <section className="py-12 bg-slate-50 min-h-screen">

      <div className="max-w-7xl mx-auto px-4 sm:px-6">

        {/* ENCABEZADO */}
        <div className="text-center max-w-4xl mx-auto mb-10">

          <span className="text-amber-500 font-bold text-xs uppercase tracking-widest block mb-2">
            Arte, historia y cultura
          </span>

          <h1 className="text-3xl sm:text-5xl font-black text-slate-900 uppercase tracking-tight mb-4">
            Centros culturales de Río
          </h1>

          <p className="text-slate-600 text-base sm:text-lg">

            diferentes capítulos de la historia de Río de Janeiro.
          </p>

        </div>


        {/* SELECTOR */}

          <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-5 sm:p-6">

            <p className="text-[11px] font-bold uppercase tracking-widest text-teal-600 mb-2">

            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

              <h2 className="text-xl sm:text-2xl font-black text-slate-900">

              <button
                type="button"
                onClick={() =>
                  setSelectorCentrosAbierto(!selectorCentrosAbierto)

                <span>
                  {selectorCentrosAbierto ? '▲' : '▼'}
                </span>

            </div>
          </div>


          {selectorCentrosAbierto && (

                <input

                  value={busquedaCentro}

              </div>


              <div className="max-h-[430px] overflow-y-auto pr-1">

                <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3">

                  {centrosFiltrados.map((centro) => (

                    <button
                      type="button"
                      key={centro.id}
                      onClick={() => {
                        setCentroSeleccionado(centro.id);
                        setSelectorCentrosAbierto(false);
                        setBusquedaCentro('');
                      }}
                      className={`overflow-hidden rounded-2xl text-left transition-all border ${
                        centroSeleccionado === centro.id
                          ? 'bg-slate-900 text-white border-slate-900 shadow-md scale-[1.02]'
                          : 'bg-slate-50 text-slate-700 border-slate-100 hover:bg-teal-50 hover:border-teal-200'
                      }`}
                    >

                      {centro.miniatura && (
                        <img
                          src={centro.miniatura}
                          alt={centro.nombre}
                          className="w-full h-24 sm:h-28 object-cover"
                        />
                      )}

                      <div className="min-h-[82px] px-3 py-4 flex items-center justify-center">

                        <span className="text-xs sm:text-sm font-bold leading-snug text-center w-full">
                          {centro.nombre}
                        </span>

                      </div>

                    </button>

                  ))}

                </div>

              </div>


              {centrosFiltrados.length === 0 && (
                <p className="text-center text-sm text-slate-500 py-8">

                </p>
              )}

            </div>
          )}

        </div>


        {/* CENTRO SELECCIONADO */}

            <div className="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 mb-8">

                </h2>

                <p className="text-amber-500 font-bold text-sm mb-6">
                  {centroActual.subtitulo}
                </p>

                <p className="text-slate-600 leading-relaxed text-sm sm:text-base max-w-4xl">
                  {centroActual.descripcion}
                </p>

              </div>


              {centroActual.fotoPrincipal && (
                <div className="px-2 pb-2">

                  <div className="rounded-2xl overflow-hidden h-72 sm:h-[480px] shadow-md">

                    <img
                      src={centroActual.fotoPrincipal}
                      alt={centroActual.nombre}

                  </div>

                </div>
              )}

            </div>


            {/* HISTORIA */}

              <p className="text-slate-600 text-base sm:text-lg leading-relaxed">

            </div>


            {centroActual.fotoMedia && (

                <img
                  src={centroActual.fotoMedia}
                  alt={`${centroActual.nombre} - interior`}

                <div
                  key={titulo}

        .toLowerCase()

  return (
    <section className="py-12 bg-slate-50 min-h-screen">

      <div className="max-w-7xl mx-auto px-4 sm:px-6">

            Escenarios y espectáculos
          </span>

          <h1 className="text-3xl sm:text-5xl font-black text-slate-900 uppercase tracking-tight mb-4">
            Teatros de Río de Janeiro

          <p className="text-slate-600 text-base sm:text-lg">

                        setSelectorTeatrosAbierto(false);
                        setBusquedaTeatro('');
                      }}
                      className={`overflow-hidden rounded-2xl text-left transition-all border ${
                        teatroSeleccionado === teatro.id
                          ? 'bg-slate-900 text-white border-slate-900 shadow-md scale-[1.02]'
                          : 'bg-slate-50 text-slate-700 border-slate-100 hover:bg-teal-50 hover:border-teal-200'

                    >

                      {teatro.miniatura && (
                        <img
                          src={teatro.miniatura}
                          alt={teatro.nombre}
                          className="w-full h-24 sm:h-28 object-cover"

                      <div className="min-h-[82px] px-3 py-4 flex items-center justify-center">

                        <span className="text-xs sm:text-sm font-bold leading-snug text-center w-full">
                          {teatro.nombre}

                      </div>

                    </button>

                  ))}

                </div>

              </div>


              {teatrosFiltrados.length === 0 && (
                <p className="text-center text-sm text-slate-500 py-8">

              )}

        </div>

                <p className="text-amber-500 font-bold text-sm mb-6">
                  {teatroActual.subtitulo}

                <p className="text-slate-600 leading-relaxed text-sm sm:text-base max-w-4xl">
                  {teatroActual.descripcion}
                </p>

              </div>


              {teatroActual.fotoPrincipal && (
                <div className="px-2 pb-2">
                  <img
                    src={teatroActual.fotoPrincipal}
                    alt={teatroActual.nombre}
                    className="w-full h-72 sm:h-[480px] object-cover rounded-2xl"

                </div>
              )}

            </div>


            {/* HISTORIA */}

            {/* INFORMACIÓN PRÁCTICA */}

function SeccionIglesias() {

  const [iglesiaSeleccionada, setIglesiaSeleccionada] =
    useState('catedral-metropolitana');

  const [selectorIglesiasAbierto, setSelectorIglesiasAbierto] =
    useState(false);

  const [busquedaIglesia, setBusquedaIglesia] =
    useState('');

  const iglesiaActual = IGLESIAS_DATA.find(
    (iglesia) => iglesia.id === iglesiaSeleccionada
  );

  const iglesiasFiltradas = IGLESIAS_DATA.filter(
    (iglesia) =>
      iglesia.nombre
        .toLowerCase()
        .includes(busquedaIglesia.toLowerCase())
  );

  return (
    <section className="py-12 bg-slate-50 min-h-screen">

      <div className="max-w-7xl mx-auto px-4 sm:px-6">

        {/* ENCABEZADO */}
        <div className="text-center max-w-4xl mx-auto mb-10">

          <span className="text-amber-500 font-bold text-xs uppercase tracking-widest block mb-2">
            Fe, historia y patrimonio
          </span>

          <h1 className="text-3xl sm:text-5xl font-black text-slate-900 uppercase tracking-tight mb-4">
            Iglesias y catedrales de Río
          </h1>

          <p className="text-slate-600 text-base sm:text-lg">
            Templos coloniales, santuarios, arquitectura moderna,
            arte barroco y lugares fundamentales de la historia de Río.
          </p>

        </div>


        {/* AVISO DE RESPETO */}
        <div className="bg-teal-50 border border-teal-200 rounded-2xl p-5 mb-8">

          <p className="text-sm text-teal-900 leading-relaxed">
            <strong>Importante:</strong> estos lugares continúan funcionando
            como espacios religiosos. Durante misas, matrimonios, funerales
            y momentos de oración, mantén silencio, utiliza vestimenta adecuada
            y pregunta antes de fotografiar.
          </p>

        </div>


        {/* SELECTOR */}
        <div className="mb-10">

          <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-5 sm:p-6">

            <p className="text-[11px] font-bold uppercase tracking-widest text-teal-600 mb-2">
              Iglesia seleccionada
            </p>

            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

              <h2 className="text-xl sm:text-2xl font-black text-slate-900">
                {iglesiaActual?.nombre}
              </h2>

              <button
                type="button"
                onClick={() =>
                  setSelectorIglesiasAbierto(!selectorIglesiasAbierto)
                }
                className="inline-flex items-center justify-center gap-2 bg-slate-900 hover:bg-teal-700 text-white font-black text-xs uppercase tracking-wide px-5 py-3.5 rounded-xl transition-all"
              >
                <span>
                  {selectorIglesiasAbierto
                    ? 'Cerrar lista'
                    : 'Elegir otra iglesia'}
                </span>

                <span>
                  {selectorIglesiasAbierto ? '▲' : '▼'}
                </span>
              </button>

            </div>
          </div>


          {selectorIglesiasAbierto && (
            <div className="mt-3 bg-white rounded-3xl border border-slate-200 shadow-xl p-4 sm:p-6">

              <div className="relative mb-5">

                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                  🔍
                </span>

                <input
                  type="text"
                  value={busquedaIglesia}
                  onChange={(e) => setBusquedaIglesia(e.target.value)}
                  placeholder="Buscar iglesia, catedral o santuario..."
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-11 pr-4 text-sm text-slate-700 outline-none focus:ring-2 focus:ring-teal-500"
                />

              </div>


              <div className="max-h-[430px] overflow-y-auto pr-1">

                <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3">

                  {iglesiasFiltradas.map((iglesia) => (

                    <button
                      type="button"
                      key={iglesia.id}
                      onClick={() => {
                        setIglesiaSeleccionada(iglesia.id);
                        setSelectorIglesiasAbierto(false);
                        setBusquedaIglesia('');
                      }}
                      className={`overflow-hidden rounded-2xl text-left transition-all border ${
                        iglesiaSeleccionada === iglesia.id
                          ? 'bg-slate-900 text-white border-slate-900 shadow-md scale-[1.02]'
                          : 'bg-slate-50 text-slate-700 border-slate-100 hover:bg-teal-50 hover:border-teal-200'
                      }`}
                    >

                      {iglesia.miniatura && (
                        <img
                          src={iglesia.miniatura}
                          alt={iglesia.nombre}
                          className="w-full h-24 sm:h-28 object-cover"
                        />
                      )}

                      <div className="min-h-[82px] px-3 py-4 flex items-center justify-center">

                        <span className="text-xs sm:text-sm font-bold leading-snug text-center w-full">
                          {iglesia.nombre}
                        </span>

                      </div>

                    </button>

                  ))}

                </div>

              </div>


              {iglesiasFiltradas.length === 0 && (
                <p className="text-center text-sm text-slate-500 py-8">
                  No encontramos una iglesia con ese nombre.
                </p>
              )}

            </div>
          )}

        </div>


        {/* IGLESIA SELECCIONADA */}
        {iglesiaActual && (
          <div key={iglesiaActual.id}>

            <div className="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 mb-8">

              <div className="p-6 sm:p-10">

                <span className="text-teal-600 font-bold text-xs uppercase tracking-widest">
                  {iglesiaActual.categoria}
                </span>

                <h2 className="text-3xl sm:text-4xl font-black text-slate-900 mt-2 mb-2">
                  {iglesiaActual.nombre}
                </h2>

                <p className="text-amber-500 font-bold text-sm mb-6">
                  {iglesiaActual.subtitulo}
                </p>

                <p className="text-slate-600 leading-relaxed text-sm sm:text-base max-w-4xl">
                  {iglesiaActual.descripcion}
                </p>

              </div>


              {iglesiaActual.fotoPrincipal && (
                <div className="px-2 pb-2">

                  <img
                    src={iglesiaActual.fotoPrincipal}
                    alt={iglesiaActual.nombre}
                    className="w-full h-72 sm:h-[480px] object-cover rounded-2xl"
                  />

                </div>
              )}

            </div>


            {/* HISTORIA */}
            <div className="max-w-4xl mx-auto mb-10">

              <span className="text-teal-600 font-bold text-xs uppercase tracking-widest">
                Historia
              </span>

              <h2 className="text-2xl sm:text-3xl font-black text-slate-900 mt-2 mb-5">
                Historia del templo
              </h2>

              <p className="text-slate-600 text-base sm:text-lg leading-relaxed">
                {iglesiaActual.historia}
              </p>

            </div>


            {iglesiaActual.fotoMedia && (
              <div className="my-12 rounded-3xl overflow-hidden shadow-md">

                <img
                  src={iglesiaActual.fotoMedia}
                  alt={`${iglesiaActual.nombre} - interior`}
                  className="w-full h-72 sm:h-[430px] object-cover"
                />

              </div>
            )}


            {/* INFORMACIÓN PRÁCTICA */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">

              {[
                ['📍 Dirección', iglesiaActual.direccion],
                ['🕐 Visitas', iglesiaActual.horario],
                ['🎟️ Entrada', iglesiaActual.valor],
                ['⏱️ Duración recomendada', iglesiaActual.duracion],
                ['♿ Accesibilidad', iglesiaActual.accesibilidad],
                ['🚇 Cómo llegar', iglesiaActual.comoLlegar]
              ].map(([titulo, contenido]) => (

                <div
                  key={titulo}
                  className="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm"
                >

                  <p className="text-xs uppercase tracking-widest text-teal-600 font-black mb-2">
                    {titulo}
                  </p>

                  <p className="text-slate-700 text-sm leading-relaxed">
                    {contenido}
                  </p>

                </div>

              ))}

            </div>


            {/* CONSEJO */}
            <div className="bg-amber-50 border-2 border-amber-300 rounded-3xl p-6 sm:p-8 mb-8">

              <div className="flex items-start gap-4">

                <div className="text-3xl shrink-0">
                  💡
                </div>

                <div>

                  <p className="text-xs uppercase tracking-widest text-amber-600 font-black mb-2">
                    Consejo de Ernestinho
                  </p>

                  <p className="text-slate-700 text-sm sm:text-base leading-relaxed">
                    {iglesiaActual.consejoErnestinho}
                  </p>

                </div>

              </div>

            </div>


            {/* DESTACADO */}
            <div className="bg-slate-900 text-white rounded-3xl p-6 sm:p-8 mb-8">

              <p className="text-xs uppercase tracking-widest text-amber-400 font-bold mb-2">
                ⭐ Lo más destacado
              </p>

              <p className="font-bold text-lg">
                {iglesiaActual.destaque}
              </p>

            </div>


            {/* MAPA */}
            <div className="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm mb-10">

              <div className="p-6">

                <p className="text-xs uppercase tracking-widest text-teal-600 font-black mb-2">
                  Ubicación
                </p>

                <h2 className="text-2xl font-black text-slate-900">
                  Mapa de Google
                </h2>

              </div>

              <div className="w-full h-[350px] sm:h-[450px]">

                <iframe
                  src={iglesiaActual.mapa}
                  width="100%"
                  height="100%"
                  style={{ border: 0 }}
                  loading="lazy"
                  allowFullScreen
                  referrerPolicy="no-referrer-when-downgrade"
                  title={`Mapa de ${iglesiaActual.nombre}`}
                ></iframe>

              </div>

            </div>


            {/* WHATSAPP */}
            <div className="bg-slate-900 text-white rounded-3xl p-6 sm:p-8 mb-10">

              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-6">

                <div>

                  <h2 className="text-xl sm:text-2xl font-black mb-2">
                    ¿Necesitas ayuda para organizar tu visita?
                  </h2>

                  <p className="text-slate-300 text-sm sm:text-base">
                    Ernestinho puede ayudarte con tu itinerario histórico
                    y cultural en Río.
                  </p>

                </div>

                <a
                  href={`https://wa.me/5521969946938?text=${encodeURIComponent(
                    `Hola Ernestinho, quiero conocer ${iglesiaActual.nombre} y necesito más información.`

                  target="_blank"
                  rel="noopener noreferrer"
                  className="inline-flex items-center justify-center bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs sm:text-sm uppercase tracking-wide px-6 py-4 rounded-xl transition-all shadow-md"

                  HABLAR CON ERNESTINHO
                </a>

              </div>

            </div>

          </div>
        )}

      </div>

    </section>
  );

function SeccionFuertesFortalezas() {

  const [fuerteSeleccionado, setFuerteSeleccionado] =
    useState('forte-copacabana');

  const [selectorFuertesAbierto, setSelectorFuertesAbierto] =
    useState(false);

  const [busquedaFuerte, setBusquedaFuerte] =
    useState('');

  const fuerteActual = FUERTES_DATA.find(
    (fuerte) => fuerte.id === fuerteSeleccionado
  );

  const fuertesFiltrados = FUERTES_DATA.filter(
    (fuerte) =>
      `${fuerte.nombre} ${fuerte.ciudad}`
        .toLowerCase()
        .includes(busquedaFuerte.toLowerCase())
  );

  return (
    <section className="py-12 bg-slate-50 min-h-screen">

      <div className="max-w-7xl mx-auto px-4 sm:px-6">

        {/* ENCABEZADO */}
        <div className="text-center max-w-4xl mx-auto mb-10">

          <span className="text-amber-500 font-bold text-xs uppercase tracking-widest block mb-2">
            Historia y defensa de Guanabara
          </span>

          <h1 className="text-3xl sm:text-5xl font-black text-slate-900 uppercase tracking-tight mb-4">
            Fuertes y fortalezas
          </h1>

          <p className="text-slate-600 text-base sm:text-lg">
            Fortificaciones históricas, museos militares y miradores
            estratégicos de Río de Janeiro y Niterói.
          </p>

        </div>


        {/* AVISO */}
        <div className="bg-amber-50 border border-amber-300 rounded-2xl p-5 mb-8">

          <p className="text-sm text-slate-700 leading-relaxed">
            <strong>Importante:</strong> varios lugares continúan dentro de
            instalaciones militares activas. Lleva un documento con fotografía,
            respeta las instrucciones y confirma la visita antes de desplazarte.
            No fotografíes áreas o equipos sin autorización.
          </p>

        </div>


        {/* SELECTOR */}
        <div className="mb-10">

          <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-5 sm:p-6">

            <p className="text-[11px] font-bold uppercase tracking-widest text-teal-600 mb-2">
              Fortaleza seleccionada
            </p>

            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

              <div>
                <h2 className="text-xl sm:text-2xl font-black text-slate-900">
                  {fuerteActual?.nombre}
                </h2>

                <p className="text-sm text-slate-500 mt-1">
                  {fuerteActual?.ciudad}
                </p>
              </div>

              <button
                type="button"
                onClick={() =>
                  setSelectorFuertesAbierto(!selectorFuertesAbierto)
                }
                className="inline-flex items-center justify-center gap-2 bg-slate-900 hover:bg-teal-700 text-white font-black text-xs uppercase tracking-wide px-5 py-3.5 rounded-xl transition-all"
              >
                <span>
                  {selectorFuertesAbierto
                    ? 'Cerrar lista'
                    : 'Elegir otra fortaleza'}
                </span>

                <span>
                  {selectorFuertesAbierto ? '▲' : '▼'}
                </span>
              </button>

            </div>
          </div>


          {selectorFuertesAbierto && (
            <div className="mt-3 bg-white rounded-3xl border border-slate-200 shadow-xl p-4 sm:p-6">

              <div className="relative mb-5">

                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                  🔍
                </span>

                <input
                  type="text"
                  value={busquedaFuerte}
                  onChange={(e) => setBusquedaFuerte(e.target.value)}
                  placeholder="Buscar fuerte, fortaleza, Río o Niterói..."
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-11 pr-4 text-sm text-slate-700 outline-none focus:ring-2 focus:ring-teal-500"
                />

              </div>


              <div className="max-h-[430px] overflow-y-auto pr-1">

                <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3">

                  {fuertesFiltrados.map((fuerte) => (

                    <button
                      type="button"
                      key={fuerte.id}
                      onClick={() => {
                        setFuerteSeleccionado(fuerte.id);
                        setSelectorFuertesAbierto(false);
                        setBusquedaFuerte('');
                      }}
                      className={`overflow-hidden rounded-2xl text-left transition-all border ${
                        fuerteSeleccionado === fuerte.id
                          ? 'bg-slate-900 text-white border-slate-900 shadow-md scale-[1.02]'
                          : 'bg-slate-50 text-slate-700 border-slate-100 hover:bg-teal-50 hover:border-teal-200'
                      }`}
                    >

                      {fuerte.miniatura && (
                        <img
                          src={fuerte.miniatura}
                          alt={fuerte.nombre}
                          className="w-full h-24 sm:h-28 object-cover"
                        />
                      )}

                      <div className="min-h-[96px] px-3 py-4 flex flex-col items-center justify-center">

                        <span className="text-xs sm:text-sm font-bold leading-snug text-center">
                          {fuerte.nombre}
                        </span>

                        <span className={`text-[10px] uppercase tracking-wide mt-2 ${
                          fuerteSeleccionado === fuerte.id
                            ? 'text-teal-300'
                            : 'text-teal-600'
                        }`}>
                          {fuerte.ciudad}
                        </span>

                      </div>

                    </button>

                  ))}

                </div>

              </div>


              {fuertesFiltrados.length === 0 && (
                <p className="text-center text-sm text-slate-500 py-8">
                  No encontramos una fortaleza con ese nombre.
                </p>
              )}

            </div>
          )}

        </div>


        {/* FUERTE SELECCIONADO */}
        {fuerteActual && (
          <div key={fuerteActual.id}>

            <div className="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 mb-8">

              <div className="p-6 sm:p-10">

                <span className="text-teal-600 font-bold text-xs uppercase tracking-widest">
                  {fuerteActual.categoria} · {fuerteActual.ciudad}
                </span>

                <h2 className="text-3xl sm:text-4xl font-black text-slate-900 mt-2 mb-2">
                  {fuerteActual.nombre}
                </h2>

                <p className="text-amber-500 font-bold text-sm mb-6">
                  {fuerteActual.subtitulo}
                </p>

                <p className="text-slate-600 leading-relaxed text-sm sm:text-base max-w-4xl">
                  {fuerteActual.descripcion}
                </p>

              </div>


              {fuerteActual.fotoPrincipal && (
                <div className="px-2 pb-2">

                  <img
                    src={fuerteActual.fotoPrincipal}
                    alt={fuerteActual.nombre}
                    className="w-full h-72 sm:h-[480px] object-cover rounded-2xl"
                  />

                </div>
              )}

            </div>

function SeccionFamilia() {

  const [actividadSeleccionada, setActividadSeleccionada] =
    useState('bioparque');

  const [selectorFamiliaAbierto, setSelectorFamiliaAbierto] =
    useState(false);

  const [busquedaFamilia, setBusquedaFamilia] =
    useState('');

  const actividadActual = FAMILIA_DATA.find(
    (actividad) => actividad.id === actividadSeleccionada
  );

  const actividadesFiltradas = FAMILIA_DATA.filter(
    (actividad) =>
      `${actividad.nombre} ${actividad.categoria}`
        .toLowerCase()
        .includes(busquedaFamilia.toLowerCase())
  );

  return (
    <section className="py-12 bg-slate-50 min-h-screen">

      <div className="max-w-7xl mx-auto px-4 sm:px-6">

        {/* ENCABEZADO */}
        <div className="text-center max-w-4xl mx-auto mb-10">

          <span className="text-amber-500 font-bold text-xs uppercase tracking-widest block mb-2">
            Río para todas las edades
          </span>

          <h1 className="text-3xl sm:text-5xl font-black text-slate-900 uppercase tracking-tight mb-4">
            Río en familia
          </h1>

          <p className="text-slate-600 text-base sm:text-lg">
            Animales, ciencia, fútbol, carnaval, naturaleza y juegos
            para disfrutar Río con niños y adolescentes.
          </p>

        </div>


        {/* SELECTOR */}
        <div className="mb-10">

          <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-5 sm:p-6">

            <p className="text-[11px] font-bold uppercase tracking-widest text-teal-600 mb-2">
              Actividad seleccionada
            </p>

            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

              <h2 className="text-xl sm:text-2xl font-black text-slate-900">
                {actividadActual?.nombre}
              </h2>

              <button
                type="button"
                onClick={() =>
                  setSelectorFamiliaAbierto(!selectorFamiliaAbierto)
                }
                className="inline-flex items-center justify-center gap-2 bg-slate-900 hover:bg-teal-700 text-white font-black text-xs uppercase tracking-wide px-5 py-3.5 rounded-xl transition-all"
              >
                <span>
                  {selectorFamiliaAbierto
                    ? 'Cerrar lista'
                    : 'Elegir otra actividad'}
                </span>

                <span>
                  {selectorFamiliaAbierto ? '▲' : '▼'}
                </span>
              </button>

            </div>
          </div>


          {selectorFamiliaAbierto && (
            <div className="mt-3 bg-white rounded-3xl border border-slate-200 shadow-xl p-4 sm:p-6">

              <div className="relative mb-5">

                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                  🔍
                </span>

                <input
                  type="text"
                  value={busquedaFamilia}
                  onChange={(e) => setBusquedaFamilia(e.target.value)}
                  placeholder="Buscar actividad familiar..."
                  className="w-full bg-slate-50 border border-slate-200 rounded-xl py-3.5 pl-11 pr-4 text-sm text-slate-700 outline-none focus:ring-2 focus:ring-teal-500"
                />

              </div>


              <div className="max-h-[430px] overflow-y-auto pr-1">

                <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-3">

                  {actividadesFiltradas.map((actividad) => (

                    <button
                      type="button"
                      key={actividad.id}
                      onClick={() => {
                        setActividadSeleccionada(actividad.id);
                        setSelectorFamiliaAbierto(false);
                        setBusquedaFamilia('');
                      }}
                      className={`overflow-hidden rounded-2xl text-left transition-all border ${
                        actividadSeleccionada === actividad.id
                          ? 'bg-slate-900 text-white border-slate-900 shadow-md scale-[1.02]'
                          : 'bg-slate-50 text-slate-700 border-slate-100 hover:bg-teal-50 hover:border-teal-200'
                      }`}
                    >

                      {actividad.miniatura && (
                        <img
                          src={actividad.miniatura}
                          alt={actividad.nombre}
                          className="w-full h-24 sm:h-28 object-cover"
                        />
                      )}

                      <div className="min-h-[96px] px-3 py-4 flex flex-col items-center justify-center">

                        <span className="text-xs sm:text-sm font-bold leading-snug text-center">
                          {actividad.nombre}
                        </span>

                        <span className={`text-[10px] uppercase tracking-wide mt-2 text-center ${
                          actividadSeleccionada === actividad.id
                            ? 'text-teal-300'
                            : 'text-teal-600'
                        }`}>
                          {actividad.categoria}
                        </span>

                      </div>

                    </button>

                  ))}

                </div>

              </div>


              {actividadesFiltradas.length === 0 && (
                <p className="text-center text-sm text-slate-500 py-8">
                  No encontramos una actividad con ese nombre.
                </p>
              )}

            </div>
          )}

        </div>


        {/* ACTIVIDAD SELECCIONADA */}

          <div key={actividadActual.id}>

            <div className="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 mb-8">

              <div className="p-6 sm:p-10">

                <span className="text-teal-600 font-bold text-xs uppercase tracking-widest">
                  {actividadActual.categoria}
                </span>

                <h2 className="text-3xl sm:text-4xl font-black text-slate-900 mt-2 mb-2">
                  {actividadActual.nombre}
                </h2>

                <p className="text-amber-500 font-bold text-sm mb-6">
                  {actividadActual.subtitulo}
                </p>

                <p className="text-slate-600 leading-relaxed text-sm sm:text-base max-w-4xl">
                  {actividadActual.descripcion}
                </p>

              </div>


              {actividadActual.fotoPrincipal && (
                <div className="px-2 pb-2">

                  <img
                    src={actividadActual.fotoPrincipal}
                    alt={actividadActual.nombre}
                    className="w-full h-72 sm:h-[480px] object-cover rounded-2xl"
                  />

                </div>
              )}

            </div>


            {/* HISTORIA */}
            <div className="max-w-4xl mx-auto mb-10">

              <span className="text-teal-600 font-bold text-xs uppercase tracking-widest">
                Historia y contexto
              </span>

              <h2 className="text-2xl sm:text-3xl font-black text-slate-900 mt-2 mb-5">
                Conoce mejor esta experiencia
              </h2>

              <p className="text-slate-600 text-base sm:text-lg leading-relaxed">
                {actividadActual.historia}
              </p>

            </div>


            {actividadActual.fotoMedia && (
              <div className="my-12 rounded-3xl overflow-hidden shadow-md">

                <img
                  src={actividadActual.fotoMedia}
                  alt={`${actividadActual.nombre} - experiencia familiar`}
                  className="w-full h-72 sm:h-[430px] object-cover"
                />

              </div>
            )}


            {/* EXPERIENCIA */}
            <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-100 shadow-sm mb-8">

              <span className="text-teal-600 font-bold text-xs uppercase tracking-widest">
                La experiencia
              </span>

              <h2 className="text-2xl font-black text-slate-900 mt-2 mb-4">
                Qué hará la familia
              </h2>

                        className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-teal-600"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-700 mb-1">Nº Personas</label>
                      <input
                        type="number"
                        min="1"
                        max="20"
                        value={reservaDatos.personas}
                        onChange={(e) => setReservaDatos({...reservaDatos, personas: e.target.value})}
                        className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-teal-600"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-700 mb-1">Teléfono (WhatsApp)</label>
                    <input
                      type="tel"
                      required
                      value={reservaDatos.telefono}
                      onChange={(e) => setReservaDatos({...reservaDatos, telefono: e.target.value})}
                      placeholder="+54 9 11 1234 5678"
                      className="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-teal-600"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs uppercase py-4 rounded-xl transition-all shadow-md mt-2 flex items-center justify-center gap-2"
                  >
                    <Icon name="message-circle" className="w-5 h-5" />
                    Enviar Consulta a WhatsApp
                  </button>
                </form>

              </div>
            </div>
          )}

          {/* PIE DE PÁGINA / FOOTER */}
          <footer className="bg-slate-950 text-slate-400 py-12 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-full bg-slate-800 overflow-hidden flex items-center justify-center border border-slate-700">
                    <img 
                      src="https://res.cloudinary.com/qa301cbc/image/upload/f_auto,q_auto/89161BC4-595E-455D-8211-87277AC58B53" 
                      alt="Ernestinho Carioca Logo" 
                      className="w-full h-full object-cover"
                    />
                  </div>
                  <div>
                    <span className="text-lg font-black text-white uppercase tracking-tight block">
                      Ernestinho <span className="text-teal-500">Carioca</span>
                    </span>
                    <span className="text-[10px] text-slate-500 uppercase tracking-widest block">
                      Río de Janeiro desde mi mirada
                    </span>
                  </div>
                </div>

                <p className="text-xs text-slate-500 text-center md:text-right">
                  © {new Date().getFullYear()} Ernestinho Carioca. Todos los derechos reservados.<br />
                  Diseñado para viajeros que buscan vivir Río de forma real y auténtica.
                </p>

              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Renderizado en el contenedor HTML objetivo
    const rootElement = document.getElementById('ernestinho-carioca-root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<AppErnestinho />);
  </script>
  <script async src="https://www.instagram.com/embed.js"></script>
</body>
</html>
