name: SEO Final Validation
on:
  push:
    branches: [seo-museos-piloto]
    paths: ['.github/workflows/seo-finalizer2.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-museos-piloto
      - name: Validate generated SEO files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET, re
          ET.parse('sitemap.xml')
          cfg=json.loads(Path('vercel.json').read_text())
          sm=Path('sitemap.xml').read_text()
          urls=re.findall(r'<loc>(.*?)</loc>',sm)
          assert len(urls)==len(set(urls)), 'duplicate sitemap URLs'
          assert len(urls) >= 100, 'unexpectedly small sitemap'
          assert 'https://www.ernestinhocarioca.com.br/museos/museu-do-amanha' in urls
          assert 'https://www.ernestinhocarioca.com.br/eventos/carnaval-de-rio' in urls
          assert 'https://www.ernestinhocarioca.com.br/experiencias/full-day-rio' in urls
          assert not any('/experiencias/aceptar-ayuda-de-desconocidos' in u for u in urls)
          assert any(x.get('source')=='/museos/:path*' for x in cfg.get('rewrites',[]))
          assert any(x.get('source')=='/eventos/:path*' for x in cfg.get('rewrites',[]))
          print('validated sitemap URLs:',len(urls))
          print('validated rewrites:',len(cfg.get('rewrites',[])))
          PY
      - name: Extract client app for Babel parse
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*type=["\']text/babel["\'][^>]*>(.*?)</script>',text,re.S|re.I)
          assert blocks, 'no text/babel app found'
          Path('/tmp/app.jsx').write_text('\n'.join(blocks),encoding='utf-8')
          print('babel source chars:',sum(map(len,blocks)))
          PY
      - name: Parse JSX with Babel
        run: |
          npx --yes -p @babel/core -p @babel/cli -p @babel/preset-react babel /tmp/app.jsx --presets=@babel/preset-react --out-file /tmp/app.js
          test -s /tmp/app.js
      - name: Check SEO router anchors
        run: |
          grep -q 'SEO ROUTER ERNESTINHO' index.html
          grep -q 'seoInitialItemId' index.html
          grep -q "seoLocalMeta('eventos'" index.html
          grep -q 'rel="canonical"' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'Sitemap: https://www.ernestinhocarioca.com.br/sitemap.xml' robots.txt
