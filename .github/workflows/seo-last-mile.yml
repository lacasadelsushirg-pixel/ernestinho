name: SEO Final Comprehensive Validation
on:
  push:
    branches: [seo-museos-piloto]
    paths: ['.github/workflows/seo-last-mile.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-museos-piloto
      - name: Validate sitemap and routing files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          s=Path('sitemap.xml').read_text(); urls=re.findall(r'<loc>(.*?)</loc>',s)
          assert len(urls)==len(set(urls)), 'duplicate sitemap URLs'
          assert len(urls)>=450, len(urls)
          required=[
            '/museos/museu-do-amanha','/eventos/carnaval-de-rio','/experiencias/full-day-rio',
            '/playas/playa-de-arpoador','/vida-nocturna/pedra-do-sal'
          ]
          for r in required: assert 'https://www.ernestinhocarioca.com.br'+r in urls, r
          assert any('/compras/ferias/' in u for u in urls)
          assert any('/compras/mercados/' in u for u in urls)
          assert any('/compras/shoppings/' in u for u in urls)
          cfg=json.loads(Path('vercel.json').read_text())
          assert any(x.get('source')=='/museos/:path*' for x in cfg.get('rewrites',[]))
          assert any(x.get('source')=='/playas/:path*' for x in cfg.get('rewrites',[]))
          assert any(x.get('source')=='/compras/:path*' for x in cfg.get('rewrites',[]))
          print('sitemap URLs',len(urls),'rewrites',len(cfg.get('rewrites',[])))
          PY
      - name: Validate SEO anchors
        run: |
          grep -q 'SEO ROUTER ERNESTINHO' index.html
          grep -q 'seoInitialItemId' index.html
          grep -q 'const seoPrefixMap=' index.html
          grep -q 'openCatalogCard' index.html
          grep -q "seoLocalMeta('eventos'" index.html
          grep -q 'rel="canonical"' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'Sitemap: https://www.ernestinhocarioca.com.br/sitemap.xml' robots.txt
      - name: Extract JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*type=["\']text/babel["\'][^>]*>(.*?)</script>',text,re.S|re.I)
          assert blocks
          Path('/tmp/app.jsx').write_text('\n'.join(blocks),encoding='utf-8')
          print('JSX chars',sum(map(len,blocks)))
          PY
      - name: Parse complete JSX with Babel
        run: |
          mkdir -p /tmp/babel && cd /tmp/babel
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @babel/core @babel/cli @babel/preset-react >/dev/null 2>&1
          ./node_modules/.bin/babel /tmp/app.jsx --presets ./node_modules/@babel/preset-react --out-file /tmp/app.js
          test -s /tmp/app.js
