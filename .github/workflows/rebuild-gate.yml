name: Rebuild Gate
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [rebuild-production-20260924]
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: test -s assets/css/site.css
      - name: Commit compiled frontend assets
        run: |
          git add assets/css/site.css assets/vendor/react.js assets/vendor/react-dom.js assets/vendor/lucide.js
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "Rebuild: compile local frontend assets"
            git push
          fi
      - name: Persist compiled frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-frontend-assets
          path: |
            assets/css/site.css
            assets/vendor/react.js
            assets/vendor/react-dom.js
            assets/vendor/lucide.js
          retention-days: 3
      - run: npm run check:syntax

