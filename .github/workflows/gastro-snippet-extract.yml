name: Gastro snippet extract
on:
  push:
    branches: [seo-audit-20260912]
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/extract-gastro-diagnostic.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gastro-diagnostic-snippets.txt
          git diff --cached --quiet || git commit -m "chore: extract gastronomy render snippets"
          git push
